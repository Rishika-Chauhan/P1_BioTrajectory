<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23070b14' stroke='%2300d9ff' stroke-width='4'/><path d='M30 65 Q 45 30, 70 35' stroke='%2300d9ff' stroke-width='5' fill='none' stroke-linecap='round'/><circle cx='70' cy='35' r='5' fill='%235479ff'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioTrajectory | Healthcare That Understands Where Your Health Is Heading</title>
    <meta name="description" content="A complete preventive-health monitoring platform. Turns repeated biological signals into an understandable personal health trajectory." />
    <!-- Immediate theme initializer before hydration -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('biotrajectory-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="antialiased transition-colors duration-200">
    <!-- Zero-delay instant pure-white splash overlay for home page entrance -->
    <div id="biotrajectory-initial-splash" style="position:fixed;inset:0;z-index:999999;background-color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;pointer-events:none;">
      <div style="position:relative;width:340px;max-width:82vw;display:flex;align-items:center;justify-content:center;">
        <img src="/biotrajectory-logo.png" alt="BioTrajectory" style="width:100%;height:auto;object-fit:contain;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(circle at center, black 65%, transparent 100%);mask-image:radial-gradient(circle at center, black 65%, transparent 100%);" />
      </div>
    </div>
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          // Only show instant splash overlay if accessing root or home
          if (p !== '/' && p !== '/home' && !window.location.search.includes('splash=true')) {
            var s = document.getElementById('biotrajectory-initial-splash');
            if (s) s.remove();
          }
        } catch(e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
